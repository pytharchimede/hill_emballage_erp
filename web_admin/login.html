<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - HILL EMBALLAGE</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-gray) 0%, var(--primary-gray-light) 100%);
            padding: var(--spacing-lg);
        }
        
        .login-card {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: var(--border-radius-xl);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        
        .login-header {
            padding: var(--spacing-xxl) var(--spacing-xl) var(--spacing-xl);
            text-align: center;
            background: linear-gradient(135deg, var(--primary-yellow-light) 0%, var(--primary-yellow) 100%);
        }
        
        .login-logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-gray);
            margin-bottom: var(--spacing-sm);
        }
        
        .login-subtitle {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        
        .login-body {
            padding: var(--spacing-xxl) var(--spacing-xl);
        }
        
        .login-form .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .login-btn {
            width: 100%;
            padding: var(--spacing-lg);
            font-size: 1rem;
            font-weight: 600;
        }
        
        .login-footer {
            padding: var(--spacing-lg) var(--spacing-xl);
            background: var(--white-tinted);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
        }
        
        .demo-credentials {
            background: var(--light-gray);
            padding: var(--spacing-md);
            border-radius: var(--border-radius);
            margin-bottom: var(--spacing-lg);
        }
        
        .demo-credentials h4 {
            margin-bottom: var(--spacing-sm);
            color: var(--primary-gray);
            font-size: 0.9rem;
        }
        
        .demo-credentials p {
            margin: var(--spacing-xs) 0;
            font-size: 0.8rem;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-logo">📦 HILL</h1>
                <p class="login-subtitle">Gestion d'emballages</p>
            </div>
            
            <div class="login-body">
                <!-- Alertes -->
                <div id="alerts-container"></div>
                
                <!-- Informations de démonstration -->
                <div class="demo-credentials">
                    <h4>🔑 Comptes de démonstration</h4>
                    <p><strong>Admin :</strong> admin / admin123</p>
                    <p><strong>Vendeur :</strong> vendeur1 / vendeur123</p>
                    <p><strong>Livreur :</strong> livreur1 / livreur123</p>
                    <p><strong>Comptable :</strong> comptable1 / compta123</p>
                </div>
                
                <form id="login-form" class="login-form">
                    <div class="form-group">
                        <label for="username" class="form-label">Nom d'utilisateur ou Email</label>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-control" 
                            placeholder="Entrez votre nom d'utilisateur"
                            required
                            autocomplete="username"
                        >
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Mot de passe</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Entrez votre mot de passe"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                    
                    <button type="submit" class="btn btn-primary login-btn">
                        Se connecter
                    </button>
                </form>
            </div>
            
            <div class="login-footer">
                <p>&copy; 2025 HILL EMBALLAGE - Tous droits réservés</p>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
